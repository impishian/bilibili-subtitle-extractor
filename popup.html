<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilibili 字幕提取器</title>
  <style>
    body { width: 540px; margin: 0; padding: 16px; box-sizing: border-box; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: #222; background: #fff; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button, select { min-height: 34px; padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    button:hover { background: #f5f5f5; }
    button:disabled, select:disabled { cursor: not-allowed; opacity: .55; }
    select { flex: 1; min-width: 0; }
    textarea { width: 100%; height: 330px; padding: 10px; box-sizing: border-box; resize: vertical; border: 1px solid #ccc; border-radius: 6px; font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 13px; line-height: 1.55; }
    #status { min-height: 22px; margin-bottom: 8px; color: #555; font-size: 13px; line-height: 1.5; }
    .error { color: #c62828 !important; }
    .success { color: #16833c !important; }
    .secondary { color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Bilibili 字幕提取器</h1>
  <div id="status">正在读取当前视频……</div>
  <div class="row"><select id="subtitleSelect" disabled><option>暂无字幕轨道</option></select></div>
  <div class="row">
    <button id="plainButton" disabled>提取纯文本</button>
    <button id="timestampButton" disabled>提取时间轴</button>
    <button id="copyButton" disabled>复制</button>
    <button id="downloadButton" disabled>下载 TXT</button>
  </div>
  <textarea id="output" placeholder="提取结果会显示在这里"></textarea>
  <p class="secondary">若显示“没有独立字幕轨道”，画面文字通常是硬字幕，需要 ASR 或 OCR。</p>
  <script src="popup.js"></script>
</body>
</html>
